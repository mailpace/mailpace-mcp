name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already published to npm, for example 2.0.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Validate the version input
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "Invalid version: ${{ inputs.version }}"
            exit 1
          fi

      - name: Verify the version exists on npm
        run: |
          curl -fsS "https://registry.npmjs.org/@mailpace%2fmcp/${{ inputs.version }}" >/dev/null

      - name: Set the version in server.json
        run: |
          jq --arg version "${{ inputs.version }}" '
            .version = $version
            | .packages[0].version = $version
          ' server.json > server.tmp
          mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login dns --domain mailpace.com --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
