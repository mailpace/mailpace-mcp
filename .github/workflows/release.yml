name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Verify the tag matches package.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${VERSION}" = "${PACKAGE_VERSION}"

      - name: Set the release version in server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          jq --arg version "${VERSION}" '
            .version = $version
            | .packages[0].version = $version
          ' server.json > server.tmp
          mv server.tmp server.json

      - name: Publish to npm
        run: |
          if npm view "@mailpace/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "@mailpace/mcp@${VERSION} is already published; skipping npm publish"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for the npm package to become available
        run: |
          for attempt in {1..12}; do
            if npm view "@mailpace/mcp@${VERSION}" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for @mailpace/mcp@${VERSION} on npm"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login dns --domain mailpace.com --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
